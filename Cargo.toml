[package]
name = "php-curator"
version = "0.1.0"
edition = "2024"
description = "Automated PHP runtime curation system for CleanServe"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cleanserve/php-runtimes"
keywords = ["php", "runtime", "curation", "cleanserve"]

[dependencies]
# HTTP client with streaming
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }

# Archive handling
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"

# Checksums
sha2 = "0.10"
hex = "0.4"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File handling
 tempfile = "3.0"

# Cli arguments
clap = { version = "4.0", features = ["derive"] }

# Glob patterns
glob = "0.3"



[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
